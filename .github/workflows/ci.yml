## GitHub Actions CI/CD workflow for Quarkus application (Build + Auto Deploy to EC2)

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Verify
        run: ./mvnw verify -B

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.EC2_PROJECT_PATH }}
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build app
            else
              docker-compose up -d --build app
            fi
            for i in $(seq 1 30); do
              if docker logs --tail 50 easy-park-app 2>&1 | grep -q "started in"; then
                break
              fi
              sleep 2
            done
            set -a && . ./.env && set +a
            docker exec -i easy-park-db psql -U "$DB_USER" -d "$DB_NAME" -c "TRUNCATE TABLE pagamentos, permanencias, parcelas, contratos, veiculos, vagas, senha_token, clientes, funcionarios, usuarios, tarifas RESTART IDENTITY CASCADE;"
            docker exec -i easy-park-db psql -U "$DB_USER" -d "$DB_NAME" < src/main/resources/import.sql
            docker restart easy-park-app
            docker image prune -f

