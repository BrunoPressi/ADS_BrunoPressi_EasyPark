<!DOCTYPE html>
<!--
  PÁGINA DE LOGIN — Form Authentication (Jakarta EE / Quarkus)

  Esta página é carregada automaticamente pelo Quarkus quando um usuário
  não autenticado tenta acessar uma rota protegida (configurado em
  application.properties: quarkus.http.auth.form.login-page).

  IMPORTANTE: o formulário usa <form> HTML nativo, NÃO <h:form> do JSF.
  Isso é necessário porque o POST deve ir diretamente para /j_security_check
  sem que o JSF adicione o ViewState ou processe a requisição como um
  ciclo de vida Faces — o Quarkus precisa interceptar este POST antes do JSF.

  Parâmetros esperados pelo Quarkus (configurados em application.properties):
    j_username  →  quarkus.http.auth.form.username-parameter
    j_password  →  quarkus.http.auth.form.password-parameter
    POST para   →  quarkus.http.auth.form.post-location (/j_security_check)
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </f:facet>
    <title>EasyPark — Login</title>
    <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css"/>
    <h:outputStylesheet name="css/easypark.css"/>
</h:head>
<h:body>
    <!-- Componente Growl para notificações -->
    <p:growl id="growl" widgetVar="loginGrowl" showDetail="true" life="3000" />

    <!-- Dispara o growl automaticamente caso haja erro na URL (?error=true) -->
    <h:panelGroup rendered="#{not empty param.error}">
        <script>
            $(function() {
                PF('loginGrowl').renderMessage({
                    summary: 'Falha de Autenticação',
                    detail: 'E-mail ou senha inválidos. Tente novamente.',
                    severity: 'error'
                });
            });
        </script>
    </h:panelGroup>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="pi pi-car"></i>
                </div>
                <h1 class="auth-title">EasyPark ERP</h1>
                <p class="auth-subtitle">Entre com suas credenciais para acessar o sistema</p>
            </div>

            <!-- action aponta para /j_security_check — interceptado pelo Quarkus Form Auth -->
            <form method="post" action="#{request.contextPath}/j_security_check">
                <div class="field">
                    <label for="j_username">E-mail / Usuário</label>
                    <input id="j_username" name="j_username" type="text" autocomplete="username"
                           placeholder="Digite seu e-mail..."
                           class="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all w-full"
                           style="padding: 0.65rem 0.75rem;"/>
                </div>

                <div class="field">
                    <label for="j_password">Senha</label>
                    <input id="j_password" name="j_password" type="password" autocomplete="current-password"
                           placeholder="Digite sua senha..."
                           class="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all w-full"
                           style="padding: 0.65rem 0.75rem;"/>
                </div>

                <div class="mt-4">
                    <button type="submit"
                            class="ui-button ui-widget ui-state-default ui-corner-all w-full flex align-items-center justify-content-center gap-2"
                            style="height: 42px; font-weight: 600;">
                        <i class="pi pi-sign-in"></i>
                        <span class="ui-button-text ui-c">Entrar no Sistema</span>
                    </button>
                </div>

                <div class="auth-footer">
                    <a href="#{request.contextPath}/pages/public/esqueci-senha.xhtml" class="auth-link">
                        Esqueci Minha Senha
                    </a>
                </div>
            </form>
        </div>
    </div>
</h:body>
</html>
