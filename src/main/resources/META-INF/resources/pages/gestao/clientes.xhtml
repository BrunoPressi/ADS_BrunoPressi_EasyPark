<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">EasyPark — Gestão de Clientes</ui:define>

    <ui:define name="content">
        <!-- Formulário contendo barra de filtro e data table para listagem dos clientes -->
        <h:form id="dataTableForm">

            <div class="page-header">
                <div class="page-header-titles">
                    <h2 class="page-title">Gestão de Clientes</h2>
                    <p class="page-subtitle">Cadastro e consulta de clientes mensalistas e titulares de contratos</p>
                </div>
                <div>
                    <p:commandButton value="Novo Cliente"
                                     icon="pi pi-plus"
                                     actionListener="#{clienteBean.novoCliente}"
                                     process="@this"
                                     resetValues="true"
                                     update=":dialogCliente"
                                     oncomplete="PF('dialogCliente').show()" />
                </div>
            </div>

            <!-- Barra de Pesquisa por Chave Única -->
            <p:toolbar styleClass="mb-3">
                <p:toolbarGroup>
                    <span class="ui-input-icon-left mr-2">
                        <i class="pi pi-search" />
                        <p:inputText id="inputChave"
                                     style="width: 280px"
                                     value="#{clienteBean.chaveUnicaFiltro}"
                                     placeholder="Buscar por Email ou CPF..." />
                    </span>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{clienteBean.pesquisar}"
                                     update="@form"
                                     styleClass="mr-2" />

                    <p:commandButton value="Limpar"
                                     icon="pi pi-times"
                                     action="#{clienteBean.limparFiltro}"
                                     update="@form"
                                     styleClass="ui-button-outlined ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <!-- Tabela com Lazy Loading (Server-Side Pagination) -->
            <p:dataTable id="tabelaClientes"
                         widgetVar="dtClientes"
                         var="cliente"
                         value="#{clienteBean.lazyDataModel}"
                         lazy="true"
                         stripedRows="true"
                         size="small"
                         responsiveLayout="scroll"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20,50"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{cliente.id}"
                         emptyMessage="Nenhum cliente encontrado.">

                <p:column headerText="ID" sortBy="#{cliente.id}" style="width: 90px; text-align: center;">
                    <h:outputText value="#{cliente.id}" />
                </p:column>

                <p:column headerText="Nome Completo">
                    <span class="font-semibold text-900">
                        <h:outputText value="#{cliente.nomeCompleto}" />
                    </span>
                </p:column>

                <p:column headerText="CPF" style="width: 160px;">
                    <h:outputText value="#{cliente.cpf}" />
                </p:column>

                <p:column headerText="Email">
                    <h:outputText value="#{cliente.email}" />
                </p:column>

                <p:column headerText="Telefone" style="width: 160px;">
                    <h:outputText value="#{cliente.telefone}" />
                </p:column>

                <p:column headerText="Editar" style="width: 120px; text-align: center;">
                    <p:commandButton value="Editar"
                                     icon="pi pi-pencil"
                                     styleClass="ui-button-outlined ui-button-secondary ui-button-sm"
                                     oncomplete="PF('dialogCliente').show()"
                                     actionListener="#{clienteBean.selecionarCliente(cliente)}"
                                     update=":dialogCliente"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <!-- Formulário de cadastro/edição de cliente -->
        <ui:include src="/pages/gestao/dialogs/dialog-cliente.xhtml"/>

    </ui:define>
</ui:composition>
