<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">

        <style>
            .divsFormDialog {
                margin-bottom: .5rem;
            }
        </style>

        <p:commandButton value="Cadastrar Cliente"
                         action="#{clienteBean.limparCliente}"
                         update=":formDialog:formCliente"
                         style="margin-bottom: .5rem"
                         oncomplete="PF('dialogCliente').show()"/>

        <h:form id="formClientes">
            <!-- Barra de Pesquisa por Chave Única -->
            <p:toolbar style="margin-bottom: 1rem;">
                <p:toolbarGroup>
                        <span class="ui-input-icon-left" style="margin-right: .5rem;">
                            <i class="pi pi-key" />
                            <p:inputText id="inputChave"
                                         value="#{clienteBean.chaveUnicaFiltro}"
                                         placeholder="Buscar por ID ou CPF..." />
                        </span>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{clienteBean.pesquisar}"
                                     update="@form"
                                     style="margin-right: .5rem"
                                     styleClass="mr-2" />

                    <p:commandButton value="Limpar"
                                     icon="pi pi-times"
                                     action="#{clienteBean.limparFiltro}"
                                     update="@form"
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <!-- Tabela com Lazy Loading (Server-Side Pagination) -->
            <p:dataTable id="tabelaClientes"
                         widgetVar="dtClientes"
                         var="cliente"
                         value="#{clienteBean.lazyDataModel}"
                         lazy="true"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20,50"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{cliente.id}"
                         emptyMessage="Nenhum cliente encontrado.">

                <p:column headerText="ID" sortBy="#{cliente.id}" style="width: 80px; text-align: center;">
                    <h:outputText value="#{cliente.id}" />
                </p:column>

                <p:column headerText="Nome Completo">
                    <h:outputText value="#{cliente.nomeCompleto}" />
                </p:column>

                <p:column headerText="CPF">
                    <h:outputText value="#{cliente.cpf}" />
                </p:column>

                <p:column headerText="Email">
                    <h:outputText value="#{cliente.email}" />
                </p:column>

                <p:column headerText="Telefone">
                    <h:outputText value="#{cliente.telefone}" />
                </p:column>

                <p:column headerText="Editar">
                    <p:commandButton value="Editar"
                                     icon="pi pi-pencil" styleClass="rounded-button ui-button-help"
                                     oncomplete="PF('dialogCliente').show()"
                                     action="#{clienteBean.selecionarCliente(cliente)}"
                                     update=":formDialog:formCliente"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <!-- Formulário de cadastro de novo cliente -->
        <h:form id="formDialog">
            <p:dialog header="Preencha com os dados do cliente"
                      widgetVar="dialogCliente"
                      minHeight="40" width="730"
                      modal="true"
                      showEffect="fade"
                      closeOnEscape="true">
                <p:outputPanel id="formCliente">
                    <div style="margin-left: .5rem;
                                display: grid;
                                grid-template-columns: auto auto;">
                        <div class="divsFormDialog">
                            <div class="outputs">
                                <p:outputLabel for="nomeCompleto" value="Nome Completo"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="nomeCompleto"
                                         value="#{clienteBean.cliente.nomeCompleto}"
                                         placeholder="Ex: John Doe"/><br/>
                            <h:message for="nomeCompleto" style="color:red;" />
                        </div>
                        <div class="divsFormDialog">
                            <div class="outputs">
                                <p:outputLabel for="cpf" value="CPF"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="cpf"
                                         value="#{clienteBean.cliente.cpf}"
                                         placeholder="Ex: 123.456.789-01"/><br/>
                            <h:message for="cpf" style="color:red;" />
                        </div>
                        <div class="divsFormDialog">
                            <div class="outputs">
                                <p:outputLabel for="email" value="Email"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="email"
                                         value="#{clienteBean.cliente.email}"
                                         placeholder="Ex: johndoe@email.com"/><br/>
                            <h:message for="email" style="color:red;" />
                        </div>
                        <div class="divsFormDialog">
                            <div class="outputs">
                                <p:outputLabel for="telefone" value="Telefone"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="telefone"
                                         value="#{clienteBean.cliente.telefone}"
                                         placeholder="Ex: 54 9 96322831"/><br/>
                            <h:message for="telefone" style="color:red;" />
                        </div>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton type="button"
                                     value="Voltar"
                                     onclick="PF('dialogCliente').hide()"
                                     styleClass="ui-button-flat mr-2"
                                     style="width: 6rem" />
                    <p:commandButton id="btnYes"
                                     process="@form"
                                     update=":formDialog:formCliente :formClientes:tabelaClientes"
                                     action="#{clienteBean.processarCliente}"
                                     value="Salvar"
                                     style="width: 6rem" />
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
