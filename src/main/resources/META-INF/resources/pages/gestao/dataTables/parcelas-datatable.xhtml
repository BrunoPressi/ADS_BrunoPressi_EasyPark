<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <!-- Data table para listagem das parcelas associado ao contrato -->
    <p:dialog id="dialogParcelasList"
              header="Parcelas do Contrato"
              widgetVar="dialogParcelas"
              width="1020"
              responsive="true"
              closable="true"
              modal="true"
              showEffect="fade"
              closeOnEscape="true">
        <h:form id="formDialogParcelasList">
            <p:dataTable id="tabelaParcelas"
                         value="#{contratoBean.parcelas}"
                         lazy="false"
                         var="parcela"
                         widgetVar="dtParcelas"
                         stripedRows="true"
                         size="small"
                         responsiveLayout="scroll"
                         paginator="true"
                         rows="5"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{parcela.id}"
                         sortBy="#{contratoBean.sortBy}"
                         emptyMessage="Nenhuma parcela encontrada.">

                <p:column headerText="ID" style="width: 65px; text-align: center;">
                    <h:outputText value="#{parcela.id}" />
                </p:column>

                <p:column headerText="Data de Vencimento" style="text-align: center;">
                    <h:outputText value="#{parcela.dataVencimento}" >
                        <f:convertDateTime pattern="dd/MM/yyyy" type="localDate"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Data de Pagamento" style="text-align: center;">
                    <h:outputText value="#{(parcela.status) == 'pendente'
                                ? 'Pagamento Pendente'
                                : (parcela.status) == 'atrasada'
                                ? 'Pagamento Atrasado'
                                : (parcela.status) == 'cancelada'
                                ? 'Parcela Cancelada'
                                : (parcela.dataPagamento)}">
                        <f:convertDateTime pattern="dd/MM/yyyy" type="localDate"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Parcela" sortBy="#{parcela.numeroParcela}" style="width: 90px; text-align: center;">
                    <h:outputText value="#{parcela.numeroParcela}ª" />
                </p:column>

                <p:column headerText="Valor" style="text-align: right;">
                    <span class="font-semibold text-900">
                        <h:outputText value="#{parcela.valor}">
                            <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                        </h:outputText>
                    </span>
                </p:column>

                <p:column headerText="Meio de Pagamento" style="text-align: center;">
                    <h:outputText value="#{ (parcela.status) == 'pendente'
                                ? 'Pagamento Pendente'
                                : (parcela.status) == 'atrasada'
                                ? 'Pagamento Atrasado'
                                : (parcela.status) == 'cancelada'
                                ? 'Parcela Cancelada'
                                : (parcela.meioPagamento.descricao)}" />
                </p:column>

                <p:column headerText="Cobrança Enviada?" style="text-align: center;">
                    <p:tag severity="#{ (parcela.cobrancaEnviada ? 'success' : 'warning') }"
                           value="#{ (parcela.cobrancaEnviada) ? 'Sim' : 'Não'}"/>
                </p:column>

                <p:column headerText="Status" style="text-align: center;">
                    <p:tag severity="#{ (parcela.status) == 'pendente' ? 'warning'
                                : (parcela.status) == 'atrasada' ? 'danger'
                                : (parcela.status) == 'paga' ? 'success'
                                : (parcela.status) == 'cancelada' ? 'info'
                                : 'secondary'}"
                           value="#{parcela.status.descricao}" />
                </p:column>

                <p:column headerText="Pagamento" style="text-align: center;">
                    <p:link value="Ver pagamento"
                            rendered="#{parcela.invoiceUrl != null}"
                            href="#{parcela.invoiceUrl}"
                            target="_blank"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </p:dialog>
</ui:composition>
