<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <!-- Formulário de cadastro/edição de cliente -->
    <p:dialog id="dialogCliente"
              header="Dados do Cliente"
              widgetVar="dialogCliente"
              modal="true"
              width="440"
              showEffect="fade"
              closable="true"
              closeOnEscape="true">

        <p:ajax event="close" resetValues="true" update="formDialogCliente" />

        <h:form id="formDialogCliente">
            <div class="ui-fluid">
                <div class="field">
                    <p:outputLabel for="nomeCompleto" value="Nome Completo"/>
                    <p:inputText id="nomeCompleto"
                                 value="#{clienteBean.cliente.nomeCompleto}"
                                 placeholder="Ex: Maria Oliveira"/>
                    <h:message for="nomeCompleto" style="color:red;" styleClass="field-error" />
                </div>
                <div class="field">
                    <p:outputLabel for="cpf" value="CPF"/>
                    <p:inputText id="cpf"
                                 value="#{clienteBean.cliente.cpf}"
                                 placeholder="Ex: 123.456.789-01"/>
                    <h:message for="cpf" style="color:red;" styleClass="field-error" />
                </div>
                <div class="field">
                    <p:outputLabel for="email" value="Email"/>
                    <p:inputText id="email"
                                 value="#{clienteBean.cliente.email}"
                                 placeholder="Ex: maria@email.com"/>
                    <h:message for="email" style="color:red;" styleClass="field-error" />
                </div>
                <div class="field mb-0">
                    <p:outputLabel for="telefone" value="Telefone"/>
                    <p:inputText id="telefone"
                                 value="#{clienteBean.cliente.telefone}"
                                 placeholder="Ex: 54 9 96322831"/>
                    <h:message for="telefone" style="color:red;" styleClass="field-error" />
                </div>
            </div>
            <div class="dialog-footer">
                <p:commandButton type="button"
                                 value="Voltar"
                                 onclick="PF('dialogCliente').hide()"
                                 styleClass="ui-button-flat ui-button-secondary" />
                <p:commandButton value="Salvar Cliente"
                                 icon="pi pi-check"
                                 actionListener="#{clienteBean.processarCliente}"
                                 process="@form"
                                 update="@form :dataTableForm"/>
            </div>
        </h:form>
    </p:dialog>
</ui:composition>
