<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <!-- Formulário de cadastro de novo veículo -->
    <p:dialog id="dialogVeiculo"
              header="Dados do Veículo"
              widgetVar="dialogVeiculo"
              width="440"
              closable="true"
              modal="true"
              showEffect="fade"
              closeOnEscape="true">

        <p:ajax event="close" resetValues="true" update="formDialogVeiculo" />

        <h:form id="formDialogVeiculo">
            <div class="ui-fluid">
                <div class="field">
                    <p:outputLabel for="placa" value="Placa"/>
                    <p:inputText id="placa" value="#{veiculoBean.veiculo.placa}" placeholder="Ex: ABC-1D23 / ABC-1234"/>
                    <h:message for="placa" style="color: red" styleClass="field-error"/>
                </div>
                <div class="field">
                    <p:outputLabel for="tipoVeiculo" value="Tipo do Veículo"/>
                    <p:selectOneMenu id="tipoVeiculo" value="#{veiculoBean.veiculo.tipo}">
                        <f:selectItem itemLabel="Selecione o tipo do veículo" itemValue=""/>
                        <f:selectItem itemLabel="Carro" itemValue="carro"/>
                        <f:selectItem itemLabel="Moto" itemValue="moto"/>
                        <f:selectItem itemLabel="Van" itemValue="van"/>
                    </p:selectOneMenu>
                    <h:message for="tipoVeiculo" style="color: red" styleClass="field-error"/>
                </div>
                <div class="field">
                    <p:outputLabel for="marca" value="Marca (opcional)"/>
                    <p:inputText id="marca" value="#{veiculoBean.veiculo.marca}" placeholder="Ex: Chevrolet"/>
                </div>
                <div class="field">
                    <p:outputLabel for="modelo" value="Modelo (opcional)"/>
                    <p:inputText id="modelo" value="#{veiculoBean.veiculo.modelo}" placeholder="Ex: Vectra"/>
                </div>
                <div class="field mb-0">
                    <p:outputLabel for="cor" value="Cor (opcional)"/>
                    <p:inputText id="cor" value="#{veiculoBean.veiculo.cor}" placeholder="Ex: Preta"/>
                </div>
            </div>
            <div class="dialog-footer">
                <p:commandButton type="button"
                                 value="Voltar"
                                 onclick="PF('dialogVeiculo').hide()"
                                 styleClass="ui-button-flat ui-button-secondary"/>
                <p:commandButton value="Salvar Veículo"
                                 icon="pi pi-check"
                                 process="@form"
                                 actionListener="#{veiculoBean.processarVeiculo}"
                                 update="@form"/>
            </div>
        </h:form>
    </p:dialog>
</ui:composition>
