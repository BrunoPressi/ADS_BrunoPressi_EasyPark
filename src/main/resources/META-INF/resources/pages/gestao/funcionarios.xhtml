<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">

        <style>
            .outputs {
                margin-bottom: .3rem;
                margin-top: .5rem;
            }
        </style>

        <p:commandButton value="Novo Funcionário"
                         icon="pi pi-plus"
                         style="margin-bottom: .8rem"
                         action="#{funcionarioBean.limpar}"
                         update=":formDialog:formFuncionario"
                         oncomplete="PF('dialogFuncionario').show()"/>

        <h:form id="formListaFuncionarios">

            <!-- Barra de Pesquisa por Chave Única -->
            <p:toolbar style="margin-bottom: 1rem;">
                <p:toolbarGroup>
                        <span class="ui-input-icon-left" style="margin-right: .5rem;">
                            <i class="pi pi-key" />
                            <p:inputText id="inputChave"
                                         value="#{funcionarioBean.chaveUnicaFiltro}"
                                         placeholder="Buscar por ID ou Nome..." />
                        </span>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{funcionarioBean.pesquisar}"
                                     update="@form"
                                     style="margin-right: .5rem"
                                     styleClass="mr-2" />

                    <p:commandButton value="Limpar"
                                     icon="pi pi-times"
                                     action="#{funcionarioBean.limparFiltro}"
                                     update="@form"
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <!-- Tabela com Lazy Loading (Server-Side Pagination) -->
            <p:dataTable id="dataTableFuncionarios"
                         widgetVar="listaFuncionariosFiltro"
                         var="funcionario"
                         value="#{funcionarioBean.lazyDataModel}"
                         lazy="true"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20,50"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{funcionario.id}"
                         emptyMessage="Nenhum funcionario encontrado.">

                <p:column headerText="ID" sortBy="#{funcionario.id}">
                    <h:outputText value="#{funcionario.id}" />
                </p:column>
                <p:column headerText="Nome Completo" sortBy="#{funcionario.nomeCompleto}">
                    <h:outputText value="#{funcionario.nomeCompleto}" />
                </p:column>
                <p:column headerText="Email">
                    <h:outputText value="#{funcionario.email}" />
                </p:column>
                <p:column headerText="Telefone">
                    <h:outputText value="#{funcionario.telefone}" />
                </p:column>
                <p:column headerText="Editar">
                    <p:commandButton icon="pi pi-pencil" styleClass="rounded-button ui-button-help"
                                     action="#{funcionarioBean.selecionarFuncionario(funcionario)}"
                                     oncomplete="PF('dialogFuncionario').show()"
                                     update=":formDialog:formFuncionario"
                                     value="Editar"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <!-- Formulário de cadastro de novo funcionário -->
        <h:form id="formDialog">
            <p:dialog header="Preencha com os dados do funcionário"
                      widgetVar="dialogFuncionario"
                      minHeight="40" width="470"
                      modal="true"
                      showEffect="fade"
                      closeOnEscape="true">
                <p:outputPanel id="formFuncionario">
                    <div style="margin-left: .5rem">
                        <div>
                            <div class="outputs">
                                <p:outputLabel for="nomeCompleto" value="Nome Completo"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="nomeCompleto"
                                         value="#{funcionarioBean.funcionario.nomeCompleto}"
                                         placeholder="Ex: John Doe"/><br/>
                            <h:message for="nomeCompleto" style="color:red;" />
                        </div>
                        <div>
                            <div class="outputs">
                                <p:outputLabel for="email" value="Email"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="email"
                                         value="#{funcionarioBean.funcionario.email}"
                                         placeholder="Ex: johndoe@email.com"/><br/>
                            <h:message for="email" style="color:red;" />
                        </div>
                        <div>
                            <div class="outputs">
                                <p:outputLabel for="telefone" value="Telefone"/>
                            </div>
                            <p:inputText style="width: 250px"
                                         id="telefone"
                                         value="#{funcionarioBean.funcionario.telefone}"
                                         placeholder="Ex: 54 9 96322831"/><br/>
                            <h:message for="telefone" style="color:red;" />
                        </div>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton type="button"
                                     value="Voltar"
                                     onclick="PF('dialogFuncionario').hide()"
                                     styleClass="ui-button-flat mr-2"
                                     style="width: 6rem" />
                    <p:commandButton id="btnYes"
                                     process="@form"
                                     update=":formDialog:formFuncionario :formListaFuncionarios"
                                     action="#{funcionarioBean.processarFuncionario}"
                                     value="Cadastrar"
                                     style="width: 6rem" />
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
