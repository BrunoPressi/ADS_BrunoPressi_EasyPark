<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">

        <!-- Formulário para cadastrar uma nova vaga -->
        <h:form id="formVaga" style="margin-left: .9rem">
            <div class="inputs">
                <div class="inputs">
                    <p:outputLabel for="nomeVaga" value="Nome da Vaga" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
                </div>
                <div>
                    <div class="col-12 md:col-10">
                        <p:inputText id="nomeVaga" value="#{vagaBean.vagaNova.nome}" placeholder="Ex: V01"/>
                        <div>
                            <h:message for="nomeVaga" style="color:red;" />
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: .7rem">
                <p:commandButton action="#{vagaBean.processarVaga}"
                                 value="Cadastrar Vaga"
                                 process="@form"
                                 update="@form :dataTableForm"/>
            </div>

        </h:form>

        <!-- Formulário contendo uma data table para listagem das vagas -->
        <h:form id="dataTableForm" style="margin-top: .7rem">

            <!-- Barra de Pesquisa por Chave Única -->
            <p:toolbar style="margin-bottom: 1rem;">
                <p:toolbarGroup>
                        <span class="ui-input-icon-left" style="margin-right: .5rem;">
                            <i class="pi pi-key" />
                            <p:inputText id="inputChave"
                                         style="width: 240px"
                                         value="#{vagaBean.chaveUnicaFiltro}"
                                         placeholder="Buscar por nome da vaga..." />
                        </span>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{vagaBean.pesquisar}"
                                     update="@form"
                                     style="margin-right: .5rem"
                                     styleClass="mr-2" />

                    <p:commandButton value="Limpar"
                                     icon="pi pi-times"
                                     action="#{vagaBean.limparFiltro}"
                                     update="@form"
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="listaVagas"
                         widgetVar="listaVagasFiltro"
                         var="vaga"
                         value="#{vagaBean.lazyDataModel}"
                         lazy="true"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20,50"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{vaga.id}"
                         emptyMessage="Nenhuma vaga encontrada.">


                <p:column headerText="Id" sortBy="#{vaga.id}">
                    <h:outputText value="#{vaga.id}"/>
                </p:column>

                <p:column headerText="Nome" sortBy="#{vaga.nome}">
                    <h:outputText value="#{vaga.nome}" />
                </p:column>

                <p:column headerText="Status" sortBy="#{vaga.status}">
                    <h:outputText value="#{(vaga.status) == 'em_manutencao' ? 'Em Manutenção' : (vaga.status == 'ocupada' ? 'Ocupada' : 'Disponível') }" />
                </p:column>

                <p:column headerText="Editar">
                        <p:commandButton onclick="PF('editarVagaDialog').show()"
                                         action="#{vagaBean.selecionarVaga(vaga)}"
                                         update=":dialogs:editarVagaPanel"
                                         value="Clique aqui para editar"
                                     icon="pi pi-pencil" styleClass="rounded-button ui-button-help">
                    </p:commandButton>
                </p:column>

            </p:dataTable>

        </h:form>

        <!-- Formulário contendo um dialog para edição de determinada vaga -->
        <h:form id="dialogs">

            <p:dialog header="Editar Vaga" widgetVar="editarVagaDialog" minHeight="40"
                      width="350" showEffect="fade" focus="btnYes" modal="true" closeOnEscape="true">
                <p:outputPanel id="editarVagaPanel">

                    <div>
                        <p:outputLabel for="nomeVaga" value="Nome da Vaga" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
                        <p:inputText id="nomeVaga" value="#{vagaBean.vagaSelecionada.nome}" placeholder="Ex: V01"/>

                        <div>
                            <h:message id="teste" for="nomeVaga" style="color:red;" />
                        </div>

                        <p>Em manutenção?</p>
                        <p:selectBooleanCheckbox id="booleanCheckBox"
                                                 value="#{vagaBean.emManutencao}"
                                                 itemLabel="#{vagaBean.emManutencao == false ? 'Não' : 'Sim'}">
                            <p:ajax update=":dialogs:booleanCheckBox"/>
                        </p:selectBooleanCheckbox>
                    </div>

                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton type="button"
                                     value="Fechar"
                                     onclick="PF('editarVagaDialog').hide()"
                                     styleClass="ui-button-flat mr-2"
                                     style="width: 6rem" />
                    <p:commandButton id="btnYes" value="Salvar"
                                     action="#{vagaBean.editarVaga}"
                                     process="@form"
                                     update=":dialogs:editarVagaPanel :dataTableForm"
                                     style="width: 5rem" />
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
