<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">
        <!-- Formulário contendo uma data table para listagem das vagas -->
        <h:form id="dataTableForm" style="margin-top: .7rem">

            <p:commandButton value="Nova Vaga"
                             icon="pi pi-plus"
                             actionListener="#{vagaBean.novaVaga}"
                             process="@this"
                             resetValues="true"
                             update=":dialogVaga"
                             oncomplete="PF('dialogVaga').show()"
                             style="margin-bottom: .5rem"/>

            <!-- Barra de Pesquisa por Chave Única -->
            <p:toolbar style="margin-bottom: 1rem;">
                <p:toolbarGroup>
                        <span class="ui-input-icon-left" style="margin-right: .5rem;">
                            <i class="pi pi-key" />
                            <p:inputText id="inputChave"
                                         style="width: 240px"
                                         value="#{vagaBean.chaveUnicaFiltro}"
                                         placeholder="Buscar por nome da vaga..." />
                        </span>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{vagaBean.pesquisar}"
                                     update="@form"
                                     style="margin-right: .5rem"
                                     styleClass="mr-2" />

                    <p:commandButton value="Limpar"
                                     icon="pi pi-times"
                                     action="#{vagaBean.limparFiltro}"
                                     update="@form"
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="listaVagas"
                         widgetVar="listaVagasFiltro"
                         var="vaga"
                         value="#{vagaBean.lazyDataModel}"
                         lazy="true"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20,50"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{vaga.id}"
                         emptyMessage="Nenhuma vaga encontrada.">


                <p:column headerText="Id">
                    <h:outputText value="#{vaga.id}"/>
                </p:column>

                <p:column headerText="Nome">
                    <h:outputText value="#{vaga.nome}" />
                </p:column>

                <p:column headerText="Tipo da Vaga">
                    <h:outputText
                            value="#{ (vaga.tipoVaga) == 'comum' ? 'Comum'
                            : (vaga.tipoVaga) == 'idoso' ? 'Idoso'
                            : (vaga.tipoVaga) == 'moto' ? 'Moto'
                            : (vaga.tipoVaga) == 'pne' ? 'PNE'
                            : 'Indefinido'}" />
                </p:column>

                <p:column headerText="Status">
                    <p:tag severity="#{vaga.status == 'disponivel' ? 'success' : (vaga.status == 'ocupada' ? 'danger' : 'warning')}"
                           value="#{ (vaga.status) == 'disponivel' ? 'Disponível'
                           : (vaga.status == 'ocupada' ? 'Ocupada'
                           : (vaga.status == 'em_manutencao' ? 'EmManutenção'
                           : 'Não Definido'))}"/>
                </p:column>

                <p:column headerText="Editar">
                    <p:commandButton oncomplete="PF('dialogVaga').show()"
                                     action="#{vagaBean.selecionarVaga(vaga)}"
                                     update=":dialogVaga"
                                     value="Editar"
                                     icon="pi pi-pencil" styleClass="rounded-button ui-button-help">
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>

        <!-- Formulário para cadastrar uma nova vaga -->
        <p:dialog id="dialogVaga"
                  header="Preencha com os dados da vaga"
                  widgetVar="dialogVaga"
                  modal="true"
                  width="370"
                  showEffect="fade"
                  closable="false"
                  closeOnEscape="true">

            <h:form id="formDialog">
                <div class="ui-fluid">
                    <div>
                        <p:outputLabel for="nomeVaga" value="Nome da Vaga"/>
                        <p:inputText id="nomeVaga" value="#{vagaBean.vaga.nome}" placeholder="Ex: V01"/>
                        <h:message for="nomeVaga" style="color:red;" />
                    </div>
                    <div style="margin-top: .5rem">
                        <p:outputLabel for="@next" value="Tipo da Vaga"/>
                        <p:selectOneMenu id="tipoVaga" value="#{vagaBean.vaga.tipoVaga}">
                            <f:selectItem itemLabel="Selecione o tipo da vaga" itemValue=""/>
                            <f:selectItem itemLabel="Comum" itemValue="comum"/>
                            <f:selectItem itemLabel="Moto" itemValue="moto"/>
                            <f:selectItem itemLabel="PNE" itemValue="pne"/>
                            <f:selectItem itemLabel="Idoso" itemValue="idoso"/>
                        </p:selectOneMenu>
                        <h:message for="tipoVaga" style="color:red;" />
                    </div>
                    <div>
                        <p>Em manutenção?</p>
                        <p:selectBooleanCheckbox id="booleanCheckBox"
                                                 value="#{vagaBean.emManutencao}"
                                                 itemLabel="#{vagaBean.emManutencao == false ? 'Não' : 'Sim'}">
                            <p:ajax update="@this"/>
                        </p:selectBooleanCheckbox>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.5rem;">
                    <p:commandButton type="button"
                                     value="Voltar"
                                     styleClass="ui-button-flat mr-2"
                                     onclick="PF('dialogVaga').hide()"/>
                    <p:commandButton value="Salvar Vaga"
                                     actionListener="#{vagaBean.processarVaga}"
                                     process="@form"
                                     update="@form :dataTableForm"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
