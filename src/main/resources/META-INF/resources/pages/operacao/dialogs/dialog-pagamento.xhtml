<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <p:dialog id="dialogPagamento"
              widgetVar="dialogPagamento"
              closable="true"
              responsive="true"
              modal="true"
              showEffect="fade"
              width="480"
              closeOnEscape="true"
              header="Detalhes do Pagamento">

        <p:ajax event="close"
                form="formDialogPagamento"
                resetValues="true"
                update="formDialogPagamento"/>

        <p:dataTable id="formDialogPagamento"
                     value="#{permanenciaBean.pagamentoSelecionado}"
                     var="pagamento"
                     stripedRows="true"
                     size="small"
                     responsiveLayout="scroll">
            <p:column headerText="ID" style="width: 80px; text-align: center;">
                <h:outputLabel value="#{pagamento.id}"/>
            </p:column>
            <p:column headerText="Valor">
                <span class="font-semibold text-900">
                    <h:outputText value="#{pagamento.valor}">
                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                    </h:outputText>
                </span>
            </p:column>
            <p:column headerText="Meio de Pagamento">
                <h:outputText value="#{pagamento.meioPagamento.descricao}"/>
            </p:column>
        </p:dataTable>
    </p:dialog>
</ui:composition>
