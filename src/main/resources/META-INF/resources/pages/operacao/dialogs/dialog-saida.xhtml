<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <p:dialog id="dialogSaida"
              widgetVar="dialogSaida"
              closable="true"
              modal="true"
              showEffect="fade"
              width="520"
              closeOnEscape="true"
              header="Fechamento de Permanência e Pagamento">

        <p:ajax event="close"
                form="formDialogSaida"
                resetValues="true"
                update="formDialogSaida"/>

        <h:form id="formDialogSaida">
            <div class="ui-fluid" rendered="#{permanenciaBean.permanenciaSelecionada != null}">

                <!-- 1. Identificação do Veículo e Vaga -->
                <div class="checkout-info-card">
                    <div class="checkout-info-item">
                        <span class="checkout-label">Placa do Veículo</span>
                        <span class="checkout-plate-badge">
                            <i class="pi pi-car mr-1"></i>
                            <h:outputText value="#{permanenciaBean.saida.placa}"/>
                        </span>
                    </div>
                    <div class="checkout-info-item">
                        <span class="checkout-label">Veículo</span>
                        <span class="checkout-value">
                            <h:outputText value="#{not empty permanenciaBean.permanenciaSelecionada.veiculo.modelo
                                ? permanenciaBean.permanenciaSelecionada.veiculo.marca.concat(' ').concat(permanenciaBean.permanenciaSelecionada.veiculo.modelo)
                                : 'Rotativo Avulso'}"/>
                        </span>
                    </div>
                    <div class="checkout-info-item text-right">
                        <span class="checkout-label">Vaga Ocupada</span>
                        <span class="checkout-value font-bold">
                            <h:outputText value="#{permanenciaBean.permanenciaSelecionada.vaga.nome}"/>
                        </span>
                    </div>
                </div>

                <!-- 2. Período e Tempo de Permanência -->
                <div class="checkout-time-grid">
                    <div class="checkout-time-box">
                        <span class="checkout-label">Entrada</span>
                        <span class="checkout-time-value">
                            <h:outputText value="#{permanenciaBean.resumoCalculo.dataEntrada}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" type="localDateTime"/>
                            </h:outputText>
                        </span>
                    </div>
                    <div class="checkout-time-box">
                        <span class="checkout-label">Saída</span>
                        <span class="checkout-time-value">
                            <h:outputText value="#{permanenciaBean.resumoCalculo.dataSaida}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" type="localDateTime"/>
                            </h:outputText>
                        </span>
                    </div>
                    <div class="checkout-time-box checkout-time-highlight">
                        <span class="checkout-label">Tempo Total</span>
                        <span class="checkout-duration-badge">
                            <i class="pi pi-clock mr-1"></i>
                            <h:outputText value="#{permanenciaBean.resumoCalculo.tempoFormatado}"/>
                        </span>
                    </div>
                </div>

                <!-- 3. Memória de Cálculo da Tarifa -->
                <div class="payment-summary-box">
                    <div class="checkout-section-title">Memória de Cálculo da Tarifa</div>

                    <div class="checkout-calc-row">
                        <span>1ª Hora (mínimo até 60 min)</span>
                        <span class="font-medium text-900">
                            <h:outputText value="#{permanenciaBean.resumoCalculo.valorPrimeiraHora}">
                                <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                            </h:outputText>
                        </span>
                    </div>

                    <div class="checkout-calc-row">
                        <span>
                            Frações adicionais de 30 min
                            (<h:outputText value="#{permanenciaBean.resumoCalculo.quantidadeFracoesAdicionais}"/>x de
                            <h:outputText value="#{permanenciaBean.resumoCalculo.valorUnitarioFracao}">
                                <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                            </h:outputText>)
                        </span>
                        <span class="font-medium text-900">
                            <h:outputText value="#{permanenciaBean.resumoCalculo.valorTotalFracoes}">
                                <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                            </h:outputText>
                        </span>
                    </div>

                    <div class="checkout-total-row">
                        <span class="font-semibold text-900">Total a Pagar</span>
                        <span class="text-primary font-bold text-xl">
                            <h:outputText value="#{permanenciaBean.saida.valor}">
                                <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                            </h:outputText>
                        </span>
                    </div>
                </div>

                <!-- 4. Seleção do Meio de Pagamento -->
                <div class="field mb-2">
                    <p:outputLabel for="meioPagamento" value="Meio de Pagamento"/>
                    <p:selectOneMenu id="meioPagamento" value="#{permanenciaBean.saida.meioPagamento}">
                        <f:selectItem itemLabel="Selecione o meio de pagamento..." itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItem itemLabel="Pix" itemValue="PIX"/>
                        <f:selectItem itemLabel="Dinheiro (Espécie)" itemValue="DINHEIRO"/>
                        <f:selectItem itemLabel="Cartão de Crédito" itemValue="CREDIT_CARD"/>
                        <f:selectItem itemLabel="Cartão de Débito" itemValue="DEBIT_CARD"/>
                        <p:ajax update="painelTroco"/>
                    </p:selectOneMenu>
                    <h:message for="meioPagamento" style="color: red" styleClass="field-error"/>
                </div>

                <!-- 5. Calculadora de Troco (Exibida quando o meio for Dinheiro) -->
                <h:panelGroup id="painelTroco" layout="block">
                    <h:panelGroup layout="block" styleClass="checkout-change-box" rendered="#{permanenciaBean.pagamentoEmDinheiro}">
                        <div class="field mb-2">
                            <p:outputLabel for="valorRecebido" value="Valor Recebido em Dinheiro (Opcional — Cálculo de Troco)"/>
                            <p:inputNumber id="valorRecebido"
                                           value="#{permanenciaBean.valorRecebido}"
                                           symbol="R$ "
                                           decimalSeparator=","
                                           thousandSeparator="."
                                           decimalPlaces="2"
                                           minValue="0"
                                           placeholder="Ex: R$ 100,00">
                                <p:ajax event="keyup" update="resumoTroco" process="@this"/>
                                <p:ajax event="change" update="resumoTroco" process="@this"/>
                            </p:inputNumber>
                        </div>

                        <h:panelGroup id="resumoTroco" layout="block">
                            <h:panelGroup layout="block"
                                          styleClass="checkout-change-result checkout-change-ok"
                                          rendered="#{permanenciaBean.valorRecebido != null and not permanenciaBean.valorRecebidoInsuficiente}">
                                <span>Troco a devolver ao cliente:</span>
                                <strong>
                                    <h:outputText value="#{permanenciaBean.troco}">
                                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                                    </h:outputText>
                                </strong>
                            </h:panelGroup>

                            <h:panelGroup layout="block"
                                          styleClass="checkout-change-result checkout-change-warn"
                                          rendered="#{permanenciaBean.valorRecebidoInsuficiente}">
                                <i class="pi pi-exclamation-triangle mr-1"></i>
                                <span>Valor recebido é menor que o total a pagar.</span>
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:panelGroup>
                </h:panelGroup>

            </div>

            <div class="dialog-footer">
                <p:commandButton type="button"
                                 value="Voltar"
                                 onclick="PF('dialogSaida').hide()"
                                 styleClass="ui-button-flat ui-button-secondary"/>
                <p:commandButton value="Confirmar Pagamento e Saída"
                                 icon="pi pi-check"
                                 actionListener="#{permanenciaBean.processarSaida}"
                                 process="@form"
                                 update="@form :formDataTablePermanencias :dialogPagamento"/>
            </div>
        </h:form>
    </p:dialog>
</ui:composition>
