<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">

        <!-- Formulário para registro de uma nova entrada -->
        <ui:include src="/pages/operacao/dialogs/dialog-entrada.xhtml"/>

        <!-- Data Table com listagem paginada SERVER SIDE -->
        <p:dataTable id="dataTablePermanencias"
                     var="permanencia"
                     value="#{permanenciaBean.lazyDataModel}"
                     lazy="true"
                     paginator="true"
                     rows="10"
                     rowsPerPageTemplate="5,10,20"
                     paginatorPosition="bottom"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                     rowKey="#{permanencia.id}"
                     emptyMessage="Nenhuma permanência encontrada.">

            <p:column headerText="ID">
                <h:outputLabel value="#{permanencia.id}"/>
            </p:column>

            <p:column headerText="Data Entrada">
                <h:outputText value="#{permanencia.dataEntrada}">
                    <f:convertDateTime pattern="dd/MM/yyyy - HH:mm" type="localDateTime"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Data Saída">
                <h:outputText value="#{ (permanencia.dataSaida) == null ? 'Saída Não Registrada' : permanencia.dataSaida}">
                    <f:convertDateTime pattern="dd/MM/yyyy" type="localDateTime"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Status">
                <h:outputText value="#{ (permanencia.status) == 'em_andamento' ? 'Em Andamento'
                : (permanenciaStatus) == 'concluida' ? 'Concluída'
                : 'Não Definido'}"/>
            </p:column>

            <p:column headerText="Veiculo">
                <h:outputText value="#{permanencia.veiculo.placa}"/>
            </p:column>

            <p:column headerText="Vaga">
                <h:outputText value="#{permanencia.vaga.nome}"/>
            </p:column>

        </p:dataTable>

    </ui:define>
</ui:composition>
