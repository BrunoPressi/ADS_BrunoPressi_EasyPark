<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">EasyPark — Controle de Pátio (Entrada e Saídas)</ui:define>

    <ui:define name="content">

        <div class="page-header">
            <div class="page-header-titles">
                <h2 class="page-title">Controle de Entrada e Saídas</h2>
                <p class="page-subtitle">Operação de pátio em tempo real, registro de permanências e fechamento de caixa</p>
            </div>
            <h:form id="formBotaoEntrada">
                <p:commandButton value="Registrar Entrada"
                                 icon="pi pi-plus"
                                 actionListener="#{permanenciaBean.novaEntrada}"
                                 oncomplete="PF('dialogEntrada').show()"
                                 resetValues="true"
                                 process="@this"
                                 update=":formDialogEntrada" />
            </h:form>
        </div>

        <!-- Formulário para registro de uma nova entrada -->
        <ui:include src="/pages/operacao/dialogs/dialog-entrada.xhtml"/>

        <!-- Formulário para registro de uma nova saída -->
        <ui:include src="/pages/operacao/dialogs/dialog-saida.xhtml"/>

        <!-- Dialog para visualização do pagamento de saídas rotativas -->
        <ui:include src="/pages/operacao/dialogs/dialog-pagamento.xhtml"/>

        <!-- Formulário com barra de pesquisa e listagem -->
        <h:form id="formDataTablePermanencias">

            <!-- Barra de Pesquisa por Chave Única -->
            <p:toolbar styleClass="mb-3">
                <p:toolbarGroup>
                    <span class="ui-input-icon-left mr-2">
                        <i class="pi pi-search" />
                        <p:inputText id="inputChave"
                                     style="width: 280px"
                                     value="#{permanenciaBean.chaveUnicaFiltro}"
                                     placeholder="Buscar pela placa..." />
                    </span>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{permanenciaBean.pesquisar}"
                                     update="@form"
                                     styleClass="mr-2" />

                    <p:commandButton value="Limpar"
                                     icon="pi pi-times"
                                     action="#{permanenciaBean.limparFiltro}"
                                     update="@form"
                                     styleClass="ui-button-outlined ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <!-- Data Table com listagem paginada SERVER SIDE -->
            <p:dataTable id="dataTablePermanencias"
                         var="permanencia"
                         value="#{permanenciaBean.lazyDataModel}"
                         lazy="true"
                         stripedRows="true"
                         size="small"
                         responsiveLayout="scroll"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20"
                         paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Exibindo {startRecord}-{endRecord} de {totalRecords} registros"
                         rowKey="#{permanencia.id}"
                         emptyMessage="Nenhuma permanência encontrada.">

                <p:column headerText="ID" style="width: 70px; text-align: center;">
                    <h:outputLabel value="#{permanencia.id}"/>
                </p:column>

                <p:column headerText="Veículo" style="width: 120px;">
                    <span class="font-semibold text-900">
                        <h:outputText value="#{permanencia.veiculo.placa}"/>
                    </span>
                </p:column>

                <p:column headerText="Vaga" style="width: 90px; text-align: center;">
                    <span class="font-medium text-700">
                        <h:outputText value="#{permanencia.vaga.nome}"/>
                    </span>
                </p:column>

                <p:column headerText="Data Entrada" style="white-space: nowrap;">
                    <h:outputText value="#{permanencia.dataEntrada}">
                        <f:convertDateTime pattern="dd/MM/yyyy - HH:mm" type="localDateTime"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Data Saída" style="white-space: nowrap;">
                    <h:outputText value="#{ (permanencia.dataSaida) == null ? 'Saída Não Registrada' : permanencia.dataSaida}"
                                  styleClass="#{(permanencia.dataSaida) == null ? 'text-500 font-italic' : ''}">
                        <f:convertDateTime pattern="dd/MM/yyyy - HH:mm" type="localDateTime"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="É Rotativo?" style="width: 130px; text-align: center;">
                    <p:tag severity="#{ (permanencia.isRotativo) ? 'info' : 'secondary'}"
                           value="#{ (permanencia.isRotativo) ? 'Rotativo' : 'Mensalista'}"/>
                </p:column>

                <p:column headerText="Status" style="width: 140px; text-align: center;">
                    <p:tag severity="#{ (permanencia.status) == 'em_andamento' ? 'warning'
                                : (permanencia.status) == 'concluida' ? 'success'
                                : 'secondary'}"
                           value="#{ (permanencia.status) == 'em_andamento' ? 'Em Andamento'
                                : (permanencia.status) == 'concluida' ? 'Concluída'
                                : 'Não definido'}" />
                </p:column>

                <p:column headerText="Pagamento" style="width: 155px; text-align: center; white-space: nowrap;">
                    <p:commandButton value="Ver Pagamento"
                                     icon="pi pi-eye"
                                     styleClass="ui-button-outlined ui-button-secondary ui-button-sm"
                                     actionListener="#{permanenciaBean.selecionarPagamento(permanencia)}"
                                     oncomplete="if (args &amp;&amp; args.sucesso) { PF('dialogPagamento').show(); }"
                                     process="@this"
                                     update=":dialogPagamento messages"/>
                </p:column>

                <p:column headerText="Saída" style="width: 160px; text-align: center; white-space: nowrap;">
                    <p:commandButton value="Registrar Saída"
                                     icon="pi pi-sign-out"
                                     disabled="#{ (permanencia.status) == 'concluida' ? true : false}"
                                     actionListener="#{permanenciaBean.novaSaida(permanencia)}"
                                     process="@this"
                                     styleClass="ui-button-sm #{ (permanencia.status) == 'concluida' ? 'ui-button-outlined ui-button-secondary' : 'ui-button-info'}"
                                     update=":formDataTablePermanencias :dialogSaida"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
