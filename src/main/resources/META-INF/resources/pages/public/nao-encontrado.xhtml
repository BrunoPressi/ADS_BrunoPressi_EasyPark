<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </f:facet>
    <title>EasyPark — Página não encontrada</title>
    <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css"/>
    <h:outputStylesheet name="css/easypark.css"/>
</h:head>
<h:body>
    <div class="auth-page">
        <div class="auth-card text-center">
            <div class="auth-header">
                <div class="auth-logo-badge" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">
                    <i class="pi pi-exclamation-triangle"></i>
                </div>
                <h1 class="auth-title">404 — Página não encontrada</h1>
                <p class="auth-subtitle">O link acessado é inválido, expirou ou já foi utilizado.</p>
            </div>

            <p class="text-600 text-sm m-0 mb-3">Solicite um novo link ao gerente caso precise redefinir sua senha.</p>

            <div class="auth-footer">
                <h:link outcome="/login" value="Ir para o login" styleClass="auth-link" />
            </div>
        </div>
    </div>
</h:body>
</html>
