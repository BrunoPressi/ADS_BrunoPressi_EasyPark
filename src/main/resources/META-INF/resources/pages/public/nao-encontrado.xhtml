<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <f:facet name="first">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </f:facet>
    <title>Página não encontrada</title>
</h:head>
<h:body>
    <p:panel header="Página não encontrada" style="max-width: 420px; margin: 2rem auto; text-align: center;">
        <i class="pi pi-exclamation-triangle" style="font-size: 3rem; color: #f59e0b"></i>
        <h2>404</h2>
        <p>O link acessado é inválido, expirou ou já foi utilizado.</p>
        <p>Solicite um novo link ao gerente.</p>
        <h:link outcome="/login" value="Ir para o login" />
    </p:panel>
</h:body>
</html>
