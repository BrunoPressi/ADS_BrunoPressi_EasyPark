<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">

        <!-- Formulário para cadastrar uma nova vaga -->
        <h:form id="formVaga" style="margin-left: .9rem">
            <div class="inputs">
                <div class="inputs">
                    <p:outputLabel for="nomeVaga" value="Nome da Vaga" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
                </div>
                <div>
                    <div class="col-12 md:col-10">
                        <p:inputText id="nomeVaga" value="#{vagaBean.vagaNova.nome}" placeholder="Ex: V01"/>
                        <div>
                            <h:message for="nomeVaga" style="color:red;" />
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: .7rem">
                <p:commandButton action="#{vagaBean.processarVaga}" value="Cadastrar Vaga" process="@form" update="@form :dataTableForm"/>
            </div>

        </h:form>

        <!-- Formulário contendo uma data table para listagem das vagas -->
        <h:form id="dataTableForm" style="margin-top: .7rem">

            <p:dataTable id="listaVagas"
                         filteredValue="#{vagaBean.vagasListFiltrado}"
                         widgetVar="listaVagasFiltro"
                         var="vaga"
                         value="#{vagaBean.vagasList}"
                         rowKey="#{vaga.id}"
                         paginator="true"
                         rows="5"
                         paginatorPosition="bottom"
                         globalFilterOnly="true">

                <f:facet name="header">

                    <span class="ui-input-icon-left">
                        <i class="pi pi-search" />
                        <p:inputText id="globalFilter"
                                     onkeyup="PF('listaVagasFiltro').filter()"
                                     placeholder="Pesquisar pelo nome..." />
                    </span>
                </f:facet>

                <p:column headerText="Id" sortBy="#{vaga.id}">
                    <h:outputText value="#{vaga.id}"/>
                </p:column>

                <p:column headerText="Nome" sortBy="#{vaga.nome}" filterBy="#{vaga.nome}">
                    <h:outputText value="#{vaga.nome}" />
                </p:column>

                <p:column headerText="Status" sortBy="#{vaga.status}">
                    <h:outputText value="#{(vaga.status) == 'em_manutencao' ? 'Em Manutenção' : (vaga.status == 'ocupada' ? 'Ocupada' : 'Disponível') }" />
                </p:column>

                <p:column headerText="Editar">
                        <p:commandButton onclick="PF('editarVagaDialog').show()"
                                         action="#{vagaBean.selecionarVaga(vaga)}"
                                         update=":dialogs:editarVagaPanel"
                                         value="Clique aqui para editar"
                                     icon="pi pi-pencil" styleClass="rounded-button ui-button-help">
                    </p:commandButton>
                </p:column>

            </p:dataTable>

        </h:form>

        <!-- Formulário contendo um dialog para edição de determinada vaga -->
        <h:form id="dialogs">

            <p:dialog header="Editar Vaga" widgetVar="editarVagaDialog" minHeight="40"
                      width="350" showEffect="fade" focus="btnYes" closeOnEscape="true">
                <p:outputPanel id="editarVagaPanel">

                    <div>
                        <p:outputLabel for="nomeVaga" value="Nome da Vaga" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
                        <p:inputText id="nomeVaga" value="#{vagaBean.vagaSelecionada.nome}" placeholder="Ex: V01"/>

                        <div>
                            <h:message id="teste" for="nomeVaga" style="color:red;" />
                        </div>

                        <p>Em manutenção?</p>
                        <p:selectBooleanCheckbox id="booleanCheckBox" value="#{vagaBean.emManutencao}" itemLabel="#{vagaBean.emManutencao == false ? 'Não' : 'Sim'}">
                            <p:ajax update=":dialogs:booleanCheckBox"/>
                        </p:selectBooleanCheckbox>
                    </div>

                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton type="button" value="Fechar" onclick="PF('editarVagaDialog').hide()" styleClass="ui-button-flat mr-2" style="width: 6rem" />
                    <p:commandButton id="btnYes" value="Salvar"
                                     action="#{vagaBean.editarVaga}"
                                     process="@form"
                                     update=":dialogs:editarVagaPanel :dataTableForm"
                                     style="width: 5rem" />
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
