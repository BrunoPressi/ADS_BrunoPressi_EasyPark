#DataSource config
#############################################################################
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/${DB_NAME}
quarkus.datasource.jdbc.max-size=16

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true
#############################################################################

#LOG config
#############################################################################
# Define o nível mínimo global para o console
quarkus.log.console.level=INFO

# Define o nível padrão para as categorias (o padrão é INFO)
quarkus.log.level=DEBUG

#############################################################################

# =============================================================================
# CONFIGURAÇÃO DE SEGURANÇA — Quarkus 3.x + Jakarta Security + JDBC Realm
# =============================================================================
#
# FLUXO DE AUTENTICAÇÃO FORM-BASED:
#
#   1. Usuário acessa /private/home.xhtml (rota protegida).
#   2. Quarkus detecta que não há sessão autenticada e redireciona para
#      a "login-page" configurada abaixo (/login.xhtml).
#   3. O formulário de login faz POST para /j_security_check com os campos
#      j_username e j_password.
#   4. Quarkus executa a query JDBC configurada em "principal-query.sql",
#      obtém o hash BCrypt e os papéis do usuário, e verifica a senha.
#   5. Em caso de sucesso: redireciona para "landing-page" (/private/home.xhtml).
#      Em caso de falha:   redireciona para "error-page" (/login-error.xhtml).
#   6. A sessão autenticada é mantida via cookie (nome padrão: quarkus-credential).
#
# =============================================================================

# --- Realm JDBC (quarkus-elytron-security-jdbc) ------------------------------
# O realm JDBC executa a query abaixo para cada tentativa de autenticação.
# A query retorna: coluna 1 = hash BCrypt da senha, coluna 2 = papel/grupo.
# Se o usuário tem múltiplos papéis, haverá múltiplas linhas; o Quarkus
# agrega todos os valores da coluna 2 como papéis do SecurityIdentity.
quarkus.security.jdbc.enabled=true
quarkus.security.jdbc.principal-query.sql=\
SELECT f.senha, f.role \
FROM usuarios u JOIN funcionarios f ON u.id = f.usuarioId \
WHERE u.email = ?

# Mapeamento de colunas da query:
#   password-index=1  →  coluna 1 contém o hash BCrypt da senha
#   attribute index=2 →  coluna 2 contém o papel; mapeado para "groups"
#   (o atributo "groups" é o nome reservado pelo Quarkus para roles)
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.password-index=1
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=2
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups

# --- Mecanismo de autenticação FORM ------------------------------------------
# Ativa o Form Authentication (alternativa ao HTTP Basic).
# O Quarkus intercepta o POST em "post-location" e lê os parâmetros
# "username-parameter" e "password-parameter" do corpo da requisição.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login.xhtml
quarkus.http.auth.form.error-page=/login.xhtml?error=true
quarkus.http.auth.form.landing-page=/pages/gerente/funcionarios.xhtml
quarkus.http.auth.form.post-location=/j_security_check
quarkus.http.auth.form.username-parameter=j_username
quarkus.http.auth.form.password-parameter=j_password

# --- Políticas de autorização por caminho ------------------------------------
#
# O Quarkus avalia as permissões na ordem de especificidade (caminho mais
# específico tem precedência). As políticas padrão são:
#   "permit"        → acesso livre, sem autenticação
#   "authenticated" → exige qualquer usuário autenticado
# Políticas customizadas (como "admin-policy") podem restringir por papel.
#
# Estrutura de diretórios desta aplicação:
#   /pages/gerente/*              → conteúdo acessado somente pelo gerente (role gerente)
#   /pages/funcionarios/*             → conteúdo acessado somente pelo funcionário (role atendente)

# Raiz e página de entrada — redireciona para /public/index.xhtml
#quarkus.http.auth.permission.root.paths=/,/index.html,/index.xhtml
#quarkus.http.auth.permission.root.policy=permit

# Recursos públicos: páginas abertas + recursos estáticos do Jakarta Faces 4.x.
# ATENÇÃO: o caminho correto para Jakarta Faces 4.x é "jakarta.faces.resource"
# (não "javax.faces.resource", que era o padrão do JSF 2.x / Jakarta EE 8).
# Sem essa permissão, o browser não carrega CSS/JS do PrimeFaces em páginas
# públicas, pois o Quarkus redirecionaria os recursos para /login.xhtml.
quarkus.http.auth.permission.public.paths=\
  /public/*,\
  /login.xhtml,\
  /logout.xhtml,\
  /logout-success.xhtml,\
  /jakarta.faces.resource/*
quarkus.http.auth.permission.public.policy=permit

# Política customizada: restringe acesso somente ao papel "gerente"
quarkus.http.auth.policy.admin-policy.roles-allowed=gerente

# Área administrativa: exige papel "gerente" (definido por admin-policy acima)
quarkus.http.auth.permission.admin.paths=/pages/gerente/*
quarkus.http.auth.permission.admin.policy=admin-policy

# Área privada geral: exige apenas autenticação (qualquer papel)
# Esta regra é avaliada APÓS a regra admin (menor especificidade de caminho)
quarkus.http.auth.permission.private.paths=/pages/*
quarkus.http.auth.permission.private.policy=authenticated

# Pega o valor da variável de ambiente SECRET_KEY definida no .env
app.crypto.secret-key=${SECRET_KEY}
